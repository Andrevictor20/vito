name: CI/CD Pipeline & Multi-Arch Docker Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      diagnostics:
        description: "Rodar apenas o diagnóstico no Pi (sem publicar imagem nem fazer deploy)"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Type-Check Mobile
        run: |
          cd mobile
          npx tsc --noEmit

      - name: Install Desktop Dependencies & Build
        run: |
          cd desktop
          npm ci
          npm run build

  docker-publish:
    name: Build & Push Multi-Arch Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.diagnostics))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Multi-Arch Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Desktop Docker metadata
        id: meta-desktop
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vito-desktop
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Desktop Multi-Arch Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./desktop
          file: ./desktop/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-desktop.outputs.tags }}
          labels: ${{ steps.meta-desktop.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # §11.3: deploy automático no Raspberry Pi via self-hosted runner (arm64).
# Compose único (sem override): `docker compose pull/up` direto.
  # Pré-requisito no Pi (uma vez):
  #   1. Instalar o runner: Settings > Actions > Runners > New self-hosted runner
  #      (labels: self-hosted, linux, arm64) em ~/actions-runner e rodar ./run.sh
  #      (ou instalar como serviço com sudo ./svc.sh install && sudo ./svc.sh start).
  #   2. Garantir ~/vito com o remote origin, docker + compose plugin e o .env
  #      com JWT_SECRET, DATA_ENCRYPTION_KEY e SHORTIO_API_KEY preenchidos.
  deploy:
    name: Auto-Deploy on Raspberry Pi 4
    needs: docker-publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.diagnostics))
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Log in to GitHub Container Registry on Pi
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sync docker-compose and Recreate Container
        run: |
          cd ~/vito
          git fetch origin main
          git reset --hard origin/main
          # Encerra contêineres presos com timeout curto para liberar o dockerd imediatamente
          docker stop -t 5 vito-evolution-api vito-backend vito-desktop || docker kill vito-evolution-api vito-backend vito-desktop || true
          docker compose pull --quiet backend evolution-api desktop || docker compose build desktop
          docker compose run -T --rm --no-deps --user 0:0 --entrypoint sh backend -c "mkdir -p /app/data /app/data/backups /app/backups && chown -R 10001:10001 /app/data /app/backups && chmod 0700 /app/data /app/backups" || true
          docker compose up -d --force-recreate --remove-orphans evolution-postgres backend evolution-api desktop
          docker image prune -f

      - name: Report Orphan Account Cleanup
        run: |
          echo "== Últimas linhas do log do backend (diagnóstico) =="
          docker logs --tail 25 vito-backend 2>&1 || echo "(sem logs do container)"
          echo ""
          echo "== Contas placeholder órfãs (limpeza automática) =="
          if docker logs vito-backend 2>/dev/null | grep -q 'account-cleanup'; then
            docker logs vito-backend 2>/dev/null | grep 'account-cleanup' | tail -10
          else
            echo "(nenhuma linha de account-cleanup no log do container)"
          fi

      - name: Report WhatsApp Context Diagnostics
        run: |
          # O backfill roda a partir de ~45s após o boot, com backoff até ~7 min
          # (a Evolution API leva ~2 min para subir no Pi).
          sleep 160
          echo "== Backfill / contexto do WhatsApp =="
          docker logs vito-backend 2>&1 | grep -E 'WhatsAppBackfill|WhatsAppGroupMeta|Teto de heap' | tail -12 || echo "(sem linhas de backfill)"
          echo ""
          echo "== Shadow inbox (tamanho do banco de contexto) =="
          docker exec vito-backend sh -c 'ls -l /app/data/vito.db' 2>/dev/null || echo "(não foi possível inspecionar o volume)"

      - name: Verify Backend & Evolution API Healthcheck
        run: |
          echo "Verificando Backend Vito..."
          for i in $(seq 1 20); do
            if wget -qO- http://localhost:8180/healthz; then
              echo ""
              echo "✅ Backend Healthcheck OK on attempt $i"
              break
            fi
            sleep 2
          done
          echo "Verificando Evolution API..."
          for i in $(seq 1 45); do
            if wget -qO- http://127.0.0.1:8085 > /dev/null 2>&1 || curl -sf http://127.0.0.1:8085 > /dev/null 2>&1; then
              echo "✅ Evolution API OK on attempt $i"
              break
            fi
            sleep 2
          done
          echo "Verificando Desktop Web Vito (porta 8190)..."
          for i in $(seq 1 15); do
            if wget -qO- http://localhost:8190/ > /dev/null 2>&1 || curl -sf http://localhost:8190/ > /dev/null 2>&1; then
              echo "✅ Desktop Web Vito OK on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Services healthcheck failed after timeout. Container status & logs:"
          docker ps -a
          docker logs --tail 80 vito-backend || true
          docker logs --tail 80 vito-evolution-api || true
          docker logs --tail 80 vito-desktop || true
          docker logs --tail 80 vito-evolution-postgres || true
          exit 1


  # Diagnóstico on-demand no Pi: roda APENAS via workflow_dispatch e NÃO redeploya.
  # Uso: gh workflow run ci.yml  → mede RAM/CPU (AC-P5), mostra o log do contexto
  # do WhatsApp e o tamanho do shadow inbox.
  diagnostics:
    name: Diagnostics on Raspberry Pi 4
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Resource usage of containers
        run: |
          echo "== Uso de memória/CPU dos containers (teto do box: 8 GB) =="
          docker stats --no-stream --format "table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}"

      - name: WhatsApp context logs
        run: |
          echo "== Contexto do WhatsApp (últimos 200 logs filtrados) =="
          docker logs --tail 400 vito-backend 2>&1 | grep -E 'WhatsAppContext|WhatsAppBackfill|WhatsAppGroupMeta|WhatsAppReplyNudge|WhatsAppContactsCache|WhatsAppMedia|Vito DB|Teto de heap' | tail -25 || echo "(sem linhas de contexto)"
          echo ""
          echo "== Últimas linhas do backend =="
          docker logs --tail 15 vito-backend 2>&1 || true

      - name: Shadow inbox size
        run: |
          echo "== Tamanho do banco (shadow inbox incluído) =="
          docker exec vito-backend sh -c 'ls -l /app/data/vito.db' 2>/dev/null || echo "(não foi possível inspecionar o volume)"
          echo ""
          echo "== Integridade do SQLite (SQLITE_CORRUPT = 267) =="
          docker exec vito-backend sh -c 'ls /app/data/*.db' 2>/dev/null | head -5
          for db in $(docker exec vito-backend sh -c 'ls /app/data/*.db' 2>/dev/null); do
            echo "-- $db --"
            docker exec vito-backend sh -c "sqlite3 '$db' 'PRAGMA integrity_check;' 2>&1 | head -5" 2>/dev/null || echo "(sem cliente sqlite3 no container)"
          done
          echo ""
          echo "== Espaço em disco (o DB corrompido costuma ser disco cheio) =="
          docker exec vito-backend sh -c 'df -h /app/data 2>/dev/null | tail -2' 2>/dev/null || echo "(não foi possível ler o disco)"
          echo ""
          echo "== Chat JIDs / telefones presentes no shadow inbox =="
          docker exec vito-backend sh -c "grep -aoE '[0-9]{11,15}@s\.whatsapp\.net|[0-9]{10,15}@g\.us|[0-9]{10,15}@lid' /app/data/vito.db | sort | uniq -c | sort -rn | head -20" 2>/dev/null || echo "(não foi possível inspecionar os JIDs)"
          echo ""
          echo "== Telefones puros gravados (users.phone / whatsapp_integrations.phone) =="
          docker exec vito-backend sh -c "grep -aoE '\+?55[0-9]{10,12}' /app/data/vito.db | sort | uniq -c | sort -rn | head -12" 2>/dev/null || echo "(não foi possível inspecionar os telefones)"
