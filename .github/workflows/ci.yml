name: CI/CD Pipeline & Multi-Arch Docker Publish

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm ci

      - name: Type-Check Mobile
        run: |
          cd mobile
          npx tsc --noEmit

  docker-publish:
    name: Build & Push Multi-Arch Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Multi-Arch Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # §11.3: deploy automático no Raspberry Pi via self-hosted runner (arm64).
# Compose único (sem override): `docker compose pull/up` direto.
  # Pré-requisito no Pi (uma vez):
  #   1. Instalar o runner: Settings > Actions > Runners > New self-hosted runner
  #      (labels: self-hosted, linux, arm64) em ~/actions-runner e rodar ./run.sh
  #      (ou instalar como serviço com sudo ./svc.sh install && sudo ./svc.sh start).
  #   2. Garantir ~/vito com o remote origin, docker + compose plugin e o .env
  #      com JWT_SECRET, DATA_ENCRYPTION_KEY e SHORTIO_API_KEY preenchidos.
  deploy:
    name: Auto-Deploy on Raspberry Pi 4
    needs: docker-publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, arm64]
    steps:
      - name: Log in to GitHub Container Registry on Pi
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sync docker-compose and Recreate Container
        run: |
          cd ~/vito
          git fetch origin main
          git reset --hard origin/main
          # Encerra contêineres presos com timeout curto para liberar o dockerd imediatamente
          docker stop -t 5 vito-evolution-api vito-backend || docker kill vito-evolution-api vito-backend || true
          docker compose pull --quiet backend evolution-api
          docker compose run -T --rm --no-deps --user 0:0 --entrypoint sh backend -c "mkdir -p /app/data /app/data/backups /app/backups && chown -R 10001:10001 /app/data /app/backups && chmod 0700 /app/data /app/backups" || true
          docker compose up -d --force-recreate --remove-orphans evolution-postgres backend evolution-api
          docker image prune -f

      - name: Verify Backend & Evolution API Healthcheck
        run: |
          echo "Verificando Backend Vito..."
          for i in $(seq 1 20); do
            if wget -qO- http://localhost:8180/healthz; then
              echo ""
              echo "✅ Backend Healthcheck OK on attempt $i"
              break
            fi
            sleep 2
          done
          echo "Verificando Evolution API..."
          for i in $(seq 1 45); do
            if wget -qO- http://127.0.0.1:8085 > /dev/null 2>&1 || curl -sf http://127.0.0.1:8085 > /dev/null 2>&1; then
              echo "✅ Evolution API OK on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "❌ Services healthcheck failed after timeout. Container status & logs:"
          docker ps -a
          docker logs --tail 80 vito-backend || true
          docker logs --tail 80 vito-evolution-api || true
          docker logs --tail 80 vito-evolution-postgres || true
          exit 1

