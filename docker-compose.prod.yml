# ==============================================================================
# docker-compose.prod.yml — Vito Production (Raspberry Pi 4 / Docker Pull)
# ==============================================================================
services:
  vito:
    image: ghcr.io/andrevictor20/vito:latest
    container_name: vito-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_PATH=/app/data/vito.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-vito-raspberry-pi-secret-key-32chars!}
    volumes:
      - vito_data:/app/data

volumes:
  vito_data:
    driver: local
