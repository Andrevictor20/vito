# ==============================================================================
# docker-compose.prod.yml — Vito Production (Raspberry Pi 4 / Docker Pull)
# ==============================================================================
services:
  vito:
    image: ghcr.io/andrevictor20/vito:latest
    container_name: vito-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8180}:${PORT:-8180}"
    environment:
      - PORT=${PORT:-8180}
      - APP_ENV=production
      - DB_PATH=/app/data/vito.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-vito-raspberry-pi-secret-key-32chars!}
    volumes:
      - vito_data:/app/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: vito-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Herda as credenciais do docker login do host para autenticar no GHCR sem erro 401
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      - WATCHTOWER_REVIVE_STOPPED=false
      # Ativa API HTTP para que o Saturn ou Webhooks possam forçar a atualização imediata
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN:-vito-update-token-2026}
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=true
    ports:
      - "8082:8080" # Porta da API de update do Watchtower (para chamadas do Saturn/curl)

volumes:
  vito_data:
    driver: local
