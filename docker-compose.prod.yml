# ==============================================================================
# docker-compose.prod.yml — Kito Production (Raspberry Pi 4 / Docker Pull)
# ==============================================================================
services:
  kito:
    image: ghcr.io/andrevictor20/kito:latest
    container_name: kito-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_PATH=/app/data/kito.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-kito-raspberry-pi-secret-key-32chars!}
    volumes:
      - kito_data:/app/data

volumes:
  kito_data:
    driver: local
