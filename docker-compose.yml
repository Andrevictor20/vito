# ==============================================================================
# docker-compose.yml — Kito (Deploy Raspberry Pi 4 / Local)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: kito-backend:latest
    container_name: kito-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_PATH=/app/data/kito.db
    volumes:
      - kito_data:/app/data

volumes:
  kito_data:
    driver: local
