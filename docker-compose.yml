# ==============================================================================
# docker-compose.yml — Vito (Deploy Raspberry Pi 4 / Local)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ghcr.io/andrevictor20/vito:latest
    pull_policy: always
    container_name: vito-backend
    restart: unless-stopped
    ports:
      - "8180:${PORT:-8180}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8180}
      - APP_ENV=production
      - DB_PATH=/app/data/vito.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      - JWT_SECRET=${JWT_SECRET:-}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-https://vito.rasppi.cloud/api/v1/auth/google/callback}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://vito.rasppi.cloud}
      - SHORTIO_API_KEY=${SHORTIO_API_KEY:-}
      - SHORTIO_DOMAIN=${SHORTIO_DOMAIN:-vito.s.gy}
      - CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - vito_data:/app/data
    networks:
      - vito_net

  # Serviço do Cloudflare Tunnel para Zero-Trust (dispensa abertura de portas no roteador)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: vito-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - vito_net
    profiles:
      - production
      - tunnel

networks:
  vito_net:
    driver: bridge

volumes:
  vito_data:
    driver: local
