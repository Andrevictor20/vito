# ==============================================================================
# docker-compose.yml — Vito (Deploy Raspberry Pi 4 / Local)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vito-backend:latest
    container_name: vito-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_PATH=/app/data/vito.db
    volumes:
      - vito_data:/app/data

volumes:
  vito_data:
    driver: local
