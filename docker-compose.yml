# ==============================================================================
# docker-compose.yml — Vito (Deploy Raspberry Pi 4 / Local)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vito-backend:latest
    container_name: vito-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - APP_ENV=production
      - DB_PATH=/app/data/vito.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-https://vito.rasppi.cloud/api/v1/auth/google/callback}
    volumes:
      - vito_data:/app/data
    networks:
      - vito_net

  # Serviço do Cloudflare Tunnel para Zero-Trust (dispensa abertura de portas no roteador)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: vito-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - vito_net
    profiles:
      - production
      - tunnel

networks:
  vito_net:
    driver: bridge

volumes:
  vito_data:
    driver: local
