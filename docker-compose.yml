# ==============================================================================
# docker-compose.yml — Vito (arquivo único: notebook e Raspberry Pi)
# O backend roda SEMPRE da imagem publicada no GHCR (build só no CI via
# buildx); sem bloco build: para não haver conflito de digest no Pi.
# Uso: docker compose pull/up (sem -f).
# ==============================================================================
services:
  backend:
    image: ghcr.io/andrevictor20/vito:latest
    pull_policy: always
    container_name: vito-backend
    restart: unless-stopped
    ports:
      - "8180:${PORT:-8180}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8180}
      - APP_ENV=production
      - DB_PATH=/app/data/vito.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-20b}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - MISTRAL_MODEL=${MISTRAL_MODEL:-ministral-8b-latest}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3.5-lightning:free}
      - JWT_SECRET=${JWT_SECRET:-}
      - DATA_ENCRYPTION_KEY=${DATA_ENCRYPTION_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URL=${GOOGLE_REDIRECT_URL:-https://vito.rasppi.cloud/api/v1/auth/google/callback}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://vito.rasppi.cloud}
      - SHORTIO_API_KEY=${SHORTIO_API_KEY:-}
      - SHORTIO_DOMAIN=${SHORTIO_DOMAIN:-vito.s.gy}
      - CLOUDFLARE_TURNSTILE_SECRET_KEY=${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8085}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-vito_evo_key_default_change_in_prod}
    volumes:
      - vito_data:/app/data
    networks:
      - vito_net

  # Banco PostgreSQL dedicado para a Evolution API v2 (Prisma ORM)
  evolution-postgres:
    image: postgres:16-alpine
    container_name: vito-evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:-vito_evolution_pass_2026}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    networks:
      - vito_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution || pg_isready -U postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Serviço da Evolution API v2 para WhatsApp (Pairing Code, Webhooks e @vito)
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: vito-evolution-api
    restart: unless-stopped
    depends_on:
      evolution-postgres:
        condition: service_started
    ports:
      - "127.0.0.1:8085:8085"
    env_file:
      - .env
    environment:
      - SERVER_PORT=8085
      - SERVER_TYPE=http
      - SERVER_URL=http://localhost:8085
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-vito_evo_key_default_change_in_prod}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:-vito_evolution_pass_2026}@evolution-postgres:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - WEBHOOK_GLOBAL_ENABLED=false
      - DEL_INSTANCE=false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - vito_net

  # Serviço do Cloudflare Tunnel para Zero-Trust (dispensa abertura de portas no roteador)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: vito-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - vito_net
    profiles:
      - production
      - tunnel

networks:
  vito_net:
    driver: bridge

volumes:
  vito_data:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local
  evolution_pgdata:
    driver: local
