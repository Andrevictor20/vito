<head>

<title>Vito · Login v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#0b9a5f; --page:#dde1df; --bg:#ffffff; --surf:#f2f4f3; --ink:#17191b; --muted:#69706d; --line:#d2d7d4; --accent:#1fb97a;
  --blue:#2b7fd4; --blue-bg:#e4effb; --green-bg:#ddf4e8; --orange:#d9681a; --orange-bg:#fbebdb; --red:#d6355a; --red-bg:#fde6ec; --purple:#7a4fe0; --purple-bg:#eee8fd;
  --shadow:0 6px 22px rgba(20,25,22,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --acc:#34d399; --blue:#5aa2ee; --orange:#ff9a52; --red:#ff6b8a; --red-bg:#3a1620; --purple:#a58bff; --purple-bg:#241a42; --page:#050606; --bg:#0d0f10; --surf:#191c1e; --ink:#f1f3f2; --muted:#98a19d; --line:#2c3134;
  --blue-bg:#16283b; --green-bg:#12302a; --orange-bg:#35230f; --shadow:0 6px 22px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.phone{position:relative;width:100%;max-width:390px;height:100%;max-height:844px;background:var(--bg);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px rgba(0,0,0,.25);transition:background .3s}
@media (max-width:480px){.phone{max-width:none;max-height:none;border-radius:0;box-shadow:none}}
button{font-family:inherit;color:inherit}
:is(button,input,a):focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.status,.home{display:none}
@media (min-width:481px){
  .status{display:flex;justify-content:space-between;padding:12px 24px 0;font-size:13px;font-weight:500;color:var(--muted)}
  .home{display:block;width:130px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 8px}
}
.hero{padding:22px 24px 0;user-select:none;-webkit-user-select:none}
h1{margin:0;font:800 clamp(24px,6.6vw,28px)/1.3 Montserrat,sans-serif;letter-spacing:-.025em;text-align:left}
.l1{display:block}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand svg{width:40px;height:42px;color:var(--ink);flex:none}
.brand b{font:800 22px/1 Montserrat,sans-serif;letter-spacing:-.03em}
.logo .eyes{animation:look 7s ease-in-out infinite}
.logo .eye,.logo .bow{transform-box:fill-box;transform-origin:center}
.logo .eye{animation:blink 4.6s infinite}
.logo .bow{animation:spin 5.5s linear infinite}
@keyframes look{0%,14%{transform:translate(0,0)}22%,40%{transform:translate(-20px,0)}50%,56%{transform:translate(0,0)}64%,82%{transform:translate(20px,0)}92%,100%{transform:translate(0,0)}}
@keyframes blink{0%,38%,44%,84%,88%,92%,100%{transform:scaleY(1)}41%,86%,90%{transform:scaleY(.08)}}
@keyframes spin{0%,58%{transform:scaleX(1)}62%{transform:scaleX(.7)}66%{transform:scaleX(0)}70%{transform:scaleX(-.7)}74%{transform:scaleX(-1)}78%{transform:scaleX(-.7)}82%{transform:scaleX(0)}86%{transform:scaleX(.7)}90%,100%{transform:scaleX(1)}}
@media (max-height:700px){.brand{margin-bottom:12px}.brand svg{width:34px;height:36px}.brand b{font-size:19px}}
.reel{display:block;height:1.3em;overflow:hidden;color:var(--acc);white-space:nowrap}
.strip{display:block;will-change:transform}
.strip .it{display:block;height:1.3em;line-height:1.3em}
.strip .f{filter:blur(1.6px);opacity:.55;transform:scaleY(1.12)}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:2px;cursor:pointer}
.feed{flex:1;min-height:0;position:relative;overflow:hidden;padding:0 16px;-webkit-mask-image:linear-gradient(transparent,#000 22%);mask-image:linear-gradient(transparent,#000 22%)}
.inner{position:absolute;left:16px;right:16px;bottom:18px;display:flex;flex-direction:column;gap:16px}
.exch{display:flex;flex-direction:column;gap:12px;transition:opacity .4s}
.user{position:relative;opacity:0;align-self:flex-end;max-width:82%;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:20px 20px 5px 20px;font-size:15px;line-height:1.35}
.user.show{opacity:1;animation:rise .35s ease both}
.photo{display:block;width:92px;height:58px;border-radius:9px;margin-bottom:8px;background:linear-gradient(#f6f1e4,#efe7d2);padding:9px 10px;position:relative}
.photo::before,.photo::after{content:"";position:absolute;left:10px;height:4px;border-radius:2px;background:#b9ae93}
.photo::before{top:11px;width:44px}.photo::after{top:22px;width:62px;box-shadow:0 11px 0 #b9ae93}
.vito{position:relative;font-size:15px;line-height:1.45}
.vito .body{visibility:hidden}
.vito.on .body{visibility:visible;animation:rise .4s ease both}
.vito.on .card{animation:rise .45s .25s ease both}
.vito .dots{position:absolute;left:0;top:6px;display:none;gap:4px}
.vito.wait .dots{display:flex}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.vito.on .dots{display:none}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{margin-top:10px;display:flex;gap:12px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 2px 8px rgba(20,25,22,.06)}
.card.col{flex-direction:column;align-items:stretch;gap:10px}
.chip{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.chip svg{width:20px;height:20px}
.card .t{flex:1;min-width:0}
.card b{display:block;font-size:14.5px;font-weight:600}
.card small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ok{width:22px;height:22px;color:var(--accent);flex:none}
.tag{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:10px;background:var(--green-bg);color:var(--accent);flex:none}
.wa{background:var(--green-bg);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:14px;align-self:flex-start}
.mini{display:flex;gap:8px}
.mini span{height:32px;padding:0 16px;border-radius:16px;display:grid;place-items:center;font-size:13px;font-weight:600;border:1.5px solid var(--ink)}
.mini span:first-child{background:var(--ink);color:var(--bg)}

.ghost{visibility:hidden}
.live{position:absolute;left:14px;right:14px;top:10px}
.user.ph .live{top:76px}
.caret::after{content:"";display:inline-block;width:2px;height:1.05em;background:currentColor;margin-left:1px;vertical-align:-3px;animation:cur .8s steps(1) infinite}
@keyframes cur{50%{opacity:0}}

.auth{padding:12px 20px 4px;display:flex;flex-direction:column;align-items:center}
.pill{display:flex;gap:12px;padding:8px;background:var(--surf);border-radius:40px;box-shadow:var(--shadow)}
.ib{width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.ib:active{transform:scale(.92)}
.ib svg{width:26px;height:26px}
.ib.g{background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.ib.w{background:#25d366;color:#fff}
.ib.m{background:var(--ink);color:var(--bg)}
.signup{margin-top:12px;font-size:14px;font-weight:600;color:var(--ink);text-decoration:none;padding:6px}

.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 22px 26px;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px;border:0;padding:0;display:block;cursor:pointer}
.sheet h2{font:800 22px Montserrat,sans-serif;letter-spacing:-.02em;margin:0 0 14px}
.inp{position:relative;margin-bottom:12px}
.inp input{width:100%;height:54px;border-radius:10px;border:1.5px solid var(--muted);background:var(--surf);color:var(--ink);padding:0 48px 0 14px;font:400 16px Inter,sans-serif}
.eyeb{position:absolute;right:6px;top:7px;width:40px;height:40px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.cta{width:100%;height:52px;border-radius:26px;border:0;background:var(--ink);color:var(--bg);font:600 16px Inter,sans-serif;cursor:pointer;margin-top:4px}
.forgot{display:block;text-align:center;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none}
.toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,12px);background:var(--ink);color:var(--bg);font-size:13px;padding:9px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;z-index:5}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:700px){h1{font-size:clamp(22px,6.2vw,26px)}.ib{width:52px;height:52px}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <button class="handle" id="handle" aria-label="Fechar"></button>
    <h2>Entrar com e-mail</h2>
    <div class="inp"><input type="email" id="em" placeholder="E-mail" aria-label="E-mail" autocomplete="email"></div>
    <div class="inp"><input type="password" id="pw" placeholder="Senha" aria-label="Senha" autocomplete="current-password">
      <button class="eyeb" id="eye" aria-label="Mostrar senha"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.500-7 10-7 10 7 10 7-3.500 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
    <button class="cta" data-demo="Entrar">Entrar</button>
    <a class="forgot" href="#" data-demo="Esqueci a senha">Esqueci a senha</a>
  </div>
  <div class="toast" id="toast"></div>
</main>

<script>
(function(){
  var root=document.documentElement,$=function(id){return document.getElementById(id)};
  function applyHash(){root.setAttribute('data-theme',(location.hash||'').slice(1)==='escuro'?'dark':'light')}
  applyHash();window.addEventListener('hashchange',applyHash);
  var inner=$('inner'),stage=$('stage');
  var I={
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7.5l8 6 8-6"/></svg>',
    radar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>'
  };
  function chip(bg,fg,ic){return '<div class="chip" style="background:var('+bg+');color:var('+fg+')">'+I[ic]+'</div>'}
  var S=[
    {w:'organizar a agenda',k:'var(--blue)',u:'Dentista terça às 15h',v:'Marcado. Sem conflitos na sua agenda.',
     c:'<div class="card">'+chip('--blue-bg','--blue','cal')+'<div class="t"><b>Dentista</b><small>Terça, 15:00 · Google Agenda</small></div><span class="ok">'+I.check+'</span></div>'},
    {w:'ler seus e-mails',k:'var(--red)',u:'Tem e-mail importante hoje?',v:'3 novos. O da Ana pede resposta até hoje.',
     c:'<div class="card">'+chip('--red-bg','--red','mail')+'<div class="t"><b>Ana Souza · Proposta</b><small>Pede resposta hoje · Gmail</small></div><span class="tag" style="background:var(--red-bg);color:var(--red)">Urgente</span></div>'},
    {w:'monitorar preços',k:'var(--orange)',u:'Me avisa se o voo pro Rio baixar de R$ 600',v:'Radar criado. Eu confiro todo dia.',
     c:'<div class="card">'+chip('--orange-bg','--orange','radar')+'<div class="t"><b>Voo para o Rio</b><small>Hoje R$ 742 · alerta abaixo de R$ 600</small></div><svg width="44" height="22" viewBox="0 0 44 22" fill="none" stroke="#e07a2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l9 3 8 6 8-2 7 6 8 1"/></svg></div>'},
    {w:'cuidar do WhatsApp',k:'var(--acc)',u:'Responde a Isa que chego às 19h',v:'Rascunho pronto. Quer que eu envie?',
     c:'<div class="card col"><b style="font-size:12.5px;color:var(--muted);font-weight:600">Para Isa · WhatsApp</b><div class="wa">Oi! Chego às 19h.</div><div class="mini"><span>Enviar</span><span>Editar</span></div></div>'},
    {w:'escrever e-mails',k:'var(--red)',u:'Escreve pro Carlos confirmando a reunião de quinta',v:'Rascunho pronto no seu Gmail.',
     c:'<div class="card col"><b style="font-size:12.5px;color:var(--muted);font-weight:600">Para Carlos · E-mail</b><div class="wa" style="background:var(--red-bg)"><b style="font-size:13px">Confirmação da reunião</b>Oi Carlos, confirmo nossa reunião de quinta às 10h.</div><div class="mini"><span>Enviar</span><span>Editar</span></div></div>'},
    {w:'não perder prazos',k:'var(--purple)',u:'Paga esse boleto até sexta',photo:1,v:'Li o boleto e criei a tarefa.',
     c:'<div class="card">'+chip('--purple-bg','--purple','check')+'<div class="t"><b>Pagar boleto · R$ 248,90</b><small>Vence sexta · prioridade alta</small></div><span class="tag" style="background:var(--purple-bg);color:var(--purple)">Tarefa</span></div>'}
  ];
  var run=0,reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};

  function exch(s,show){
    var d=document.createElement('div');d.className='exch';
    d.innerHTML='<div class="user'+(show?' show':'')+(s.photo?' ph':'')+'">'+(s.photo?'<span class="photo"></span>':'')+'<span class="ghost">'+s.u+'</span><span class="live">'+(show?s.u:'')+'</span></div>'+
      '<div class="vito'+(show?' on':'')+'"><div class="dots"><span></span><span></span><span></span></div><div class="body">'+s.v+s.c+'</div></div>';
    return d;
  }
  function push(el){
    inner.appendChild(el);
    var h=el.offsetHeight+16;
    inner.style.transition='none';inner.style.transform='translateY('+h+'px)';inner.offsetHeight;
    inner.style.transition='transform .5s cubic-bezier(.2,.8,.2,1)';inner.style.transform='none';
  }
  async function scene(i,id){
    var s=S[i];spin(s.w);
    if(inner.children.length>=2){var old=inner.firstChild;old.style.opacity=0;setTimeout(function(){old.remove()},420)}
    var e=exch(s,false);push(e);
    var u=e.firstChild,live=u.querySelector('.live'),v=e.querySelector('.vito');
    await sleep(350);if(id!==run)return;
    u.classList.add('show');live.className='live caret';
    for(var k=1;k<=s.u.length;k++){if(id!==run)return;live.textContent=s.u.slice(0,k);await sleep(36)}
    live.className='live';
    await sleep(450);if(id!==run)return;
    v.classList.add('wait');
    await sleep(1000);if(id!==run)return;
    v.classList.remove('wait');v.classList.add('on');
    await sleep(3300);
  }
  async function start(i){
    var id=++run;
    Array.prototype.slice.call(inner.children).forEach(function(c){if(!c.querySelector('.vito.on'))c.remove()});
    if(reduce){spin(S[0].w);inner.innerHTML='';push(exch(S[0],true));push(exch(S[1],true));return}
    while(id===run){await scene(i,id);if(id!==run)return;i=(i+1)%S.length}
  }
  var cur=0;
  stage.addEventListener('click',function(){cur=(cur+1)%S.length;start(cur)});
  start(0);

  function it(t,cls){var s=S.filter(function(x){return x.w===t})[0];return '<span class="it'+cls+'"'+(s?' style="color:'+s.k+'"':'')+'>'+t+'</span>'}
  function spin(w){
    var strip=$('strip'),old=spin.shown||'';
    spin.shown=w;clearTimeout(spin.t);
    if(reduce){strip.innerHTML=it(w,'');return}
    var pool=S.map(function(s){return s.w}).filter(function(x){return x!==w&&x!==old}),f=[];
    while(f.length<4){f.push(pool[Math.floor(Math.random()*pool.length)])}
    var items=[w].concat(f,[old]);
    strip.innerHTML=items.map(function(t,k){return it(t,k>0&&k<items.length-1?' f':'')}).join('');
    strip.style.transition='none';
    strip.style.transform='translateY(-'+((items.length-1)*1.3)+'em)';
    strip.offsetHeight;
    strip.style.transition='transform 1.15s cubic-bezier(.2,.85,.3,1.08)';
    strip.style.transform='none';
    spin.t=setTimeout(function(){strip.style.transition='none';strip.style.transform='none';strip.innerHTML=it(w,'')},1250);
  }

  var sheet=$('sheet'),scrim=$('scrim');
  function openSheet(o){
    sheet.classList.toggle('on',o);scrim.classList.toggle('on',o);
    if(o){sheet.removeAttribute('inert');setTimeout(function(){$('em').focus({preventScroll:true})},380)}
    else{sheet.setAttribute('inert','');$('mailBtn').focus()}
  }
  $('mailBtn').addEventListener('click',function(){openSheet(true)});
  scrim.addEventListener('click',function(){openSheet(false)});
  $('handle').addEventListener('click',function(){openSheet(false)});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet.classList.contains('on'))openSheet(false)});
  $('eye').addEventListener('click',function(){
    var p=$('pw'),h=p.type==='password';p.type=h?'text':'password';this.setAttribute('aria-label',h?'Ocultar senha':'Mostrar senha');
  });

  var toast=$('toast'),tt;
  function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},2300)}
  document.querySelectorAll('[data-demo]').forEach(function(el){
    el.addEventListener('click',function(e){e.preventDefault();say('Protótipo: “'+el.getAttribute('data-demo')+'” não faz login de verdade')});
  });
  var lp;
  $('hero').addEventListener('pointerdown',function(){lp=setTimeout(function(){say('Build: OTA 01a1663 · Buscar update')},600)});
  ['pointerup','pointerleave'].forEach(function(n){$('hero').addEventListener(n,function(){clearTimeout(lp)})});
})();
</script>
</body>
</html>
